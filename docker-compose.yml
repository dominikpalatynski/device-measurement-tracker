# docker-compose.yml
version: "3.8"

services:
    # MySQL Database
    db:
        image: mysql:8.0
        container_name: iot-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: iot_monitoring
            MYSQL_USER: iot_user
            MYSQL_PASSWORD: iot_password
        ports:
            - "3306:3306"
        volumes:
            - ./docker/mysql/data:/var/lib/mysql
        networks:
            - iot-network
    # Mosquitto MQTT Broker
    mqtt:
        image: eclipse-mosquitto:2.0
        container_name: iot-mosquitto
        restart: always
        ports:
            - "1883:1883" # MQTT port
            - "9001:9001" # WebSockets port
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
            - ./mosquitto/mosquitto-data:/mosquitto/data
            - ./mosquitto/mosquitto-log:/mosquitto/log
        networks:
            - iot-network

    # phpMyAdmin for MySQL management
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: iot-phpmyadmin
        restart: always
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_USER: iot_user
            PMA_PASSWORD: iot_password
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "8081:80"
        depends_on:
            - db
        networks:
            - iot-network
    influxdb2:
        image: influxdb:2
        ports:
            - 8086:8086
        environment:
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: admin
            DOCKER_INFLUXDB_INIT_PASSWORD: password
            DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mytoken
            DOCKER_INFLUXDB_INIT_ORG: myorg
            DOCKER_INFLUXDB_INIT_BUCKET: bucket
        volumes:
            - ./docker/influxdb/influxdb2-data:/var/lib/influxdb2
            - ./docker/influxdb/influxdb2-config:/etc/influxdb2
        networks:
            - iot-network
networks:
    iot-network:
        driver: bridge
