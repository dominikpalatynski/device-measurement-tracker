# docker-compose.yml
version: "3.8"

services:
    # MySQL Database
    db:
        image: mysql:8.0
        container_name: iot-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: iot_monitoring
            MYSQL_USER: iot_user
            MYSQL_PASSWORD: iot_password
        ports:
            - "3306:3306"
        volumes:
            - ./docker/mysql/data:/var/lib/mysql
        networks:
            - iot-network
    # Mosquitto MQTT Broker
    mqtt:
        image: eclipse-mosquitto:2.0
        container_name: iot-mosquitto
        restart: always
        ports:
            - "1883:1883" # MQTT port
            - "9001:9001" # WebSockets port
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
            - ./mosquitto/mosquitto-data:/mosquitto/data
            - ./mosquitto/mosquitto-log:/mosquitto/log
        networks:
            - iot-network

    # phpMyAdmin for MySQL management
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: iot-phpmyadmin
        restart: always
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_USER: iot_user
            PMA_PASSWORD: iot_password
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "8081:80"
        depends_on:
            - db
        networks:
            - iot-network

    # MongoDB Database for time-series data
    mongodb:
        image: mongo:7.0
        container_name: iot-mongodb
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password
            MONGO_INITDB_DATABASE: iot_timeseries
        ports:
            - "27017:27017"
        volumes:
            - ./docker/mongodb/data:/data/db
            - ./docker/mongodb/config:/data/configdb
        networks:
            - iot-network

    # MongoDB Express for MongoDB management
    mongo-express:
        image: mongo-express:latest
        container_name: iot-mongo-express
        restart: always
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: admin
            ME_CONFIG_MONGODB_ADMINPASSWORD: password
            ME_CONFIG_MONGODB_SERVER: mongodb
            ME_CONFIG_MONGODB_PORT: 27017
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: admin
        ports:
            - "8082:8081"
        depends_on:
            - mongodb
        networks:
            - iot-network

networks:
    iot-network:
        driver: bridge
